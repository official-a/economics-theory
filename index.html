        .question-text{font-size:1.2rem;margin-bottom:20px;color:#e6e6e6;}
        .options{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
        @media(max-width:768px){.options{grid-template-columns:1fr;}}
        .option{padding:16px;background:#1a1a1a;border:2px solid #333;border-radius:8px;cursor:pointer;transition:all 0.3s;color:#e6e6e6;}
        .option:hover{border-color:#f6d300;background:#262626;}
        .option.selected{border-color:#f6d300;background:#262626;color:#fff;}
        .option.correct{border-color:#2ecc71;background:#0f261c;color:#b8ffcf;font-weight:bold;}
        .option.incorrect{border-color:#e74c3c;background:#2a0f0f;color:#ffb5b5;font-weight:bold;}
        .explanation{margin-top:15px;padding:15px;background:#111;border-left:4px solid #f6d300;border-radius:6px;display:none;color:#e6e6e6;}
        .explanation-title{color:#f6d300;font-weight:bold;margin-bottom:8px;}
        .controls{display:flex;justify-content:space-between;margin-top:30px;}
        button{padding:12px 28px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;transition:0.3s;}
        #prev-btn{background:#444;color:#fff;}
        #next-btn{background:#f6d300;color:#000;}
        #submit-btn{background:#2ecc71;color:#000;display:none;}

        .progress-bar{height:12px;background:#222;border-radius:6px;overflow:hidden;margin:20px 0;}
        .progress{height:100%;width:0%;background:linear-gradient(to right,#f6d300,#fff);transition:width 0.6s;}
        .loading{padding:50px;text-align:center;font-size:1.3rem;}
    </style>
</head>

        // === НОВАЯ ФУНКЦИЯ: перемешиваем варианты и возвращаем новый массив вопросов с перемешанными options и обновлённым correct ===
        function prepareQuestionsWithRandomOptions(questions) {
            return questions.map(q => {
                const oldCorrectIndex = q.correct;
                const oldOptions = [...q.options];

                // Создаём массив индексов и перемешиваем его
                const indices = [0,1,2,3];
                for (let i = indices.length-1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i+1));
                    [indices[i], indices[j]] = [indices[j], indices[i]];

                const newOptions = indices.map(i => oldOptions[i]);

                // Находим, куда попал правильный ответ после перемешивания
                const newCorrectIndex = indices.indexOf(oldCorrectIndex);

                return {
                    text: q.text,
                    options: newOptions,
                    correct: newCorrectIndex
                };
            });
        }

        const allQuestions = prepareQuestionsWithRandomOptions(allQuestionsRaw);

        let current = 0, answers = [], selected = [], mode = 'full';

        const quiz = document.getElementById('quiz');
        const result = document.getElementById('result');

        function shuffleArray(array) {
            const arr = [...array];
            for(let i=arr.length-1;i>0;i--){
                const j=Math.floor(Math.random()*(i+1));
                [arr[i],arr[j]]=[arr[j],arr[i]];
            }
            return arr;
        }

        function start() {
            selected = mode === 'full' ? [...allQuestions] : 
                       mode === 'fifty' ? shuffleArray(allQuestions).slice(0,50) :
                       shuffleArray(allQuestions).slice(0,25);
            answers = Array(selected.length).fill(null);
            current = 0;
            document.getElementById('total').textContent = selected.length;
            document.getElementById('unanswered').textContent = selected.length;
            document.getElementById('score').textContent = `0/${selected.length}`;
            quiz.style.display = 'block';
            result.style.display = 'none';
            showQuestion();
        }

        function showQuestion() {
            const q = selected[current];
            let options = q.options.map((opt,i) => {
                const letter = String.fromCharCode(65+i);
                const selectedClass = answers[current]===i ? ' selected' : '';
                const correctClass = answers[current]!==null && i===q.correct ? ' correct' : '';
                const incorrectClass = answers[current]!==null && answers[current]===i && i!==q.correct ? ' incorrect' : '';
                return `<div class="option${selectedClass}${correctClass}${incorrectClass}" onclick="${answers[current]===null?'choose('+i+')':''}">
                    ${letter}) ${opt}
                </div>`;
            }).join('');

            let explanation = '';
            if(answers[current]!==null){
                explanation = `<div class="explanation" style="display:block;">
                    <div class="explanation-title">Правильный ответ:</div>
                    ${q.options[q.correct]}
                </div>`;
            }

            quiz.innerHTML = `
                <div class="question">
                    <div class="question-number">Вопрос ${current+1} / ${selected.length}</div>
                    <div class="question-text">${q.text}</div>
                    <div class="options">${options}</div>
                    ${explanation}
                    <div class="controls">
                        <button id="prev-btn" ${current===0?'disabled':''} onclick="prev()">Предыдущий</button>
                        ${current===selected.length-1 ? 
                          '<button id="submit-btn" onclick="finish()">Закончить</button>' : 
                          '<button id="next-btn" onclick="next()">Следующий</button>'}
                    </div>
                </div>`;
            document.getElementById('current').textContent = current+1;
            updateStats();
        }

        function choose(i){
            answers[current] = i;
            updateStats();
            showQuestion();
        }

        function next(){ if(current < selected.length-1) current++; showQuestion(); }
        function prev(){ if(current > 0) current--; showQuestion(); }

        function updateStats(){
            const correct = answers.filter((a,i)=>a!==null && a===selected[i].correct).length;
            const answered = answers.filter(a=>a!==null).length;
            document.getElementById('correct').textContent = correct;
            document.getElementById('incorrect').textContent = answered - correct;
            document.getElementById('unanswered').textContent = selected.length - answered;
        }

        function finish(){
            quiz.style.display='none';
            result.style.display='block';
            const score = answers.filter((a,i)=>a!==null && a===selected[i].correct).length;
            const percent = Math.round((score/selected.length)*100);
            document.getElementById('score').textContent = `${score}/${selected.length}`;
            document.getElementById('progress').style.width = percent + '%';
            document.getElementById('grade').innerHTML = percent >= 90 ? 'Отлично <strong>5</strong>' : 
                                                          percent >= 75 ? 'Хорошо <strong>4</strong>' : 
                                                          percent >= 60 ? 'Удовлетворительно <strong>3</strong>' : 'Неудовлетворительно <strong>2</strong>';
        }

        // Кнопки режимов
        document.getElementById('full').onclick = ()=>{mode='full'; document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active')); this.classList.add('active'); start();};
        document.getElementById('fifty').onclick = ()=>{mode='fifty'; document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active')); this.classList.add('active'); start();};
        document.getElementById('twentyfive').onclick = ()=>{mode='twentyfive'; document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active')); this.classList.add('active'); start();};
        document.getElementById('new-test-btn').onclick = start;

        start();
    </script>
</body>
</html>
